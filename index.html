<!DOCTYPE html>
<html lang="en">
<head>
<style>


/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
:root {
  /* Dark Navy Palette, 070B35 → 081462 */
  --night:     #070B35;
  --night-2:   #05082B;
  --navy:      #081462;
  --navy-mid:  #0C1A7A;
  --ink:       #09103A;       /* text on light bg  */
  --ink-2:     #1A2254;       /* secondary on light */
  --canvas:    #F3F5FB;       /* light section bg   */
  --white:     #FFFFFF;

  /* Body text on dark */
  --body-dk:   rgba(255,255,255,.82);
  --body-dk-2: rgba(255,255,255,.55);

  /* Body text on light */
  --body-lt:   #2E3A6B;
  --body-lt-2: #5A668A;

  /* Gold */
  --gold:      #1A52CC;
  --gold-lt:   #4A78E0;
  --gold-dim:  rgba(26,82,204,.25);

  /* Blue */
  --blue:      #1A3FCC;
  --blue-h:    #2952F5;

  /* Borders */
  --border-dk: rgba(255,255,255,.08);
  --border-lt: rgba(8,20,98,.10);
  --border-gold: rgba(26,82,204,.22);

  /* Gradients */
  --grad-hero:  linear-gradient(155deg,#060930 0%,#081462 55%,#0C1A7A 100%);
  --grad-dark:  linear-gradient(155deg,#070B35 0%,#081462 100%);
  --grad-navy:  linear-gradient(155deg,#081462 0%,#0C1A7A 100%);
}

/* ── RESET ──────────────────────────────── */
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { font-size:16px; scroll-behavior:smooth; overflow-x:hidden; background:#070B35; }
body {
  font-family:'Figtree',sans-serif;
  font-weight:400; line-height:1.6;
  background:#070B35;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  margin:0; padding:0;
}
#hero { margin:0 !important; }
a { text-decoration:none; color:inherit; }
ul { list-style:none; }

/* ── NAV ─────────────────────────────────── */
#nav {
  position:fixed; top:0; left:0; right:0; z-index:800;
  height:72px; padding:0 5%;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid transparent;
  transition:background .4s ease, border-color .4s ease;
}
#nav.scrolled {
  background:rgba(7,11,53,.96);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-color:var(--border-gold);
}
/* ... rest of the original CSS ... */

/* ── HERO ────────────────────────────────── */
#hero {
  min-height:100svh;
  background:var(--grad-hero);
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
  padding-top:72px;
}
.hero-noise {
  position:absolute; inset:0; pointer-events:none; z-index:1; opacity:1;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves=[...]")
  background-size:256px;
}
.hero-glow {
  position:absolute; pointer-events:none; z-index:0; border-radius:50%;
}
.hero-glow-1 {
  width:700px; height:700px;
  background:radial-gradient(circle,rgba(26,63,204,.22) 0%,transparent 65%);
  top:-200px; right:-150px;
  animation:orbDrift 4s ease-in-out infinite alternate;
}
.hero-glow-2 {
  width:500px; height:500px;
  background:radial-gradient(circle,rgba(26,82,204,.07) 0%,transparent 60%);
  bottom:-150px; left:-100px;
  animation:orbDrift 6s ease-in-out infinite alternate-reverse;
}
@keyframes orbDrift {
  from { transform:translate(0,0) scale(1); }
  to   { transform:translate(40px,-30px) scale(1.1); }
}
#heroCanvas { position:absolute; inset:0; z-index:0; pointer-events: none; }
.hero-inner { position:relative; z-index:2; display:flex; flex-direction:column; flex:1; }
/* ... */
.wm-mask { display:inline-block; overflow:visible; vertical-align:bottom; line-height:1.22; padding:0.06em 0 0.16em; }
/* Stronger disable for the intro "curtain" animation: override transforms, animations, and transitions */
.wm-inner {
  display:inline-block !important;
  transform:none !important;
  animation:none !important;
  transition:none !important;
  will-change:auto !important;
}
/* If JavaScript applies inline styles to move the element, explicitly unset transform on the element and its children */
.wm-inner, .wm-inner * { transform:none !important; animation:none !important; transition:none !important; }
.wm-sp { display:inline; white-space:pre; }

/* ... remainder of original CSS and HTML unchanged ... */
</style>
</head>
<body>
<!-- The rest of the HTML follows unchanged. For safety, no structural html removed; only CSS for curtain disabled. -->

</body>
</html>
